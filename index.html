<!DOCTYPE html>
<html>
<head>
  <title>Black Myth: Wukong Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Progress Bar -->
    <div class="progress-section">
      <h2>Completion: <span id="overall-progress">0%</span></h2>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-category="ARMOR">Armor</button>
      <button class="tab-btn" data-category="CHEST">Chest</button>
      <button class="tab-btn" data-category="CURIO">Curio</button>
    </div>

    <!-- Dynamic Checklist -->
    <div id="checklist-container"></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
